name: ShapeMahjong
options:
  bundleIdPrefix: com.sans
  deploymentTarget:
    iOS: "17.0"
targets:
  ShapeMahjong:
    type: application
    platform: iOS
    sources:
      - ShapeMahjong
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sans.shapemahjong
        PRODUCT_NAME: Shape Tiles
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        CODE_SIGN_STYLE: Manual
      config:
        Debug:
          CODE_SIGNING_ALLOWED: "NO"
        Release:
          CODE_SIGNING_ALLOWED: "NO"
